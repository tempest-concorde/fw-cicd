name: Build bootc Image (Reusable)

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry (e.g., ghcr.io)'
        required: true
        type: string
      image_name:
        description: 'Image name without registry (e.g., tempest-concorde/fedora-bootc-pi)'
        required: true
        type: string
      containerfile:
        description: 'Path to Containerfile'
        required: false
        type: string
        default: 'Containerfile'
      platform:
        description: 'Build platform (e.g., linux/arm64)'
        required: false
        type: string
        default: 'linux/arm64'
      push:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: false
      compression_format:
        description: 'OCI compression format applied at push (e.g., zstd:chunked). Empty = lane default (plain). Spec 005 build flag.'
        required: false
        type: string
        default: ''
      rechunk:
        description: 'Run bootc-base-imagectl rechunk on the built image before push (spec 005 build flag, default off).'
        required: false
        type: boolean
        default: false
      tags:
        description: 'Space-separated image tags'
        required: false
        type: string
        default: ''
      smoke_test_script:
        description: 'Shell script for buildah mount smoke tests. $MOUNT is the chroot mount point, $IMAGE_REF is the local image reference.'
        required: false
        type: string
        default: ''
      extra_packages:
        description: 'Additional DNF packages to install in UBI9 builder (space-separated)'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (used for the SBOM release asset name)'
        required: false
        type: string
        default: ''
      is_release:
        description: 'Whether this is a release build (drives the SBOM failure policy)'
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: 'Image digest (set only when push=true)'
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ${{ contains(inputs.platform, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Install container tools
        run: |
          dnf -y install podman buildah skopeo make wget git jq ${{ inputs.extra_packages }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Workaround podman-login auth
        run: |
          mkdir -p $HOME/.docker
          echo '{ "auths": {} }' > $HOME/.docker/config.json

      - name: Compute tags
        id: tags
        run: |
          if [ -n "${{ inputs.tags }}" ]; then
            echo "tags=${{ inputs.tags }}" >> $GITHUB_OUTPUT
          else
            echo "tags=test ${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034  # v2
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ inputs.platform }}
          containerfiles: |
            ./${{ inputs.containerfile }}

      - name: Smoke test (buildah mount)
        if: inputs.smoke_test_script != ''
        run: |
          IMAGE_REF="${{ steps.build.outputs.image-with-tag }}"
          echo "Testing image: $IMAGE_REF"
          podman image inspect "$IMAGE_REF" --format '{{.Id}}'
          CONTAINER=$(buildah from "$IMAGE_REF")
          MOUNT=$(buildah mount $CONTAINER)
          # Run caller's smoke test
          ${{ inputs.smoke_test_script }}
          buildah unmount $CONTAINER
          buildah rm $CONTAINER
          echo "All smoke tests passed"

      - name: Rechunk image (spec 005, opt-in)
        if: inputs.rechunk
        id: rechunk
        run: |
          set -euo pipefail
          T0=$(date +%s)
          FIRST_TAG=$(echo "${{ steps.tags.outputs.tags }}" | awk '{print $1}')
          IMAGE_REF="${{ inputs.image_name }}:${FIRST_TAG}"
          # TODO(PIN-1): must be digest-pinned (quay.io is unreachable from the
          # authoring environment); tracked as pipeline pin-debt PIN-1 in
          # fw-gsd specs/005-oci-delta-minimization evaluation-report.md
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/centos-bootc/bootc-base-imagectl:stream10 \
            rechunk "containers-storage:${IMAGE_REF}"
          T1=$(date +%s)
          echo "rechunk_seconds=$(( T1 - T0 ))" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        if: inputs.push
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252  # v1.9
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ inputs.registry }}
          auth_file_path: /run/containers/0/auth.json

      - name: Push to registry (plain)
        if: inputs.push && inputs.compression_format == ''
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ inputs.registry }}

      - name: Push to registry (optimized compression, spec 005)
        if: inputs.push && inputs.compression_format != ''
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ inputs.registry }}
          extra-args: |
            --compression-format=${{ inputs.compression_format }}

      - name: Get digest
        if: inputs.push
        id: digest
        run: |
          # Use the first tag to get the digest
          FIRST_TAG=$(echo "${{ steps.tags.outputs.tags }}" | awk '{print $1}')
          DIGEST=$(podman image inspect --format '{{ .Digest }}' ${{ inputs.registry }}/${{ inputs.image_name }}:${FIRST_TAG} 2>/dev/null || \
                   skopeo inspect docker://${{ inputs.registry }}/${{ inputs.image_name }}:${FIRST_TAG} | jq -r '.Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Record optimized-build telemetry (spec 005, feeds pipeline_cost_min/storage_cost)
        if: inputs.push && ((inputs.rechunk) || (inputs.compression_format != ''))
        run: |
          set -euo pipefail
          # Registry-side storage for this push = sum of compressed layer blob sizes.
          REPO=${{ inputs.registry }}/${{ inputs.image_name }}
          STORAGE_BYTES=$(skopeo inspect --raw "docker://${REPO}@${{ steps.digest.outputs.digest }}" | jq '[.layers[].size] | add // 0')
          cat > optimized-cost.json <<EOF
          {
            "schema_version": "005.optimized-cost/1",
            "image": "${{ inputs.image_name }}",
            "digest": "${{ steps.digest.outputs.digest }}",
            "rechunk": ${{ inputs.rechunk }},
            "compression_format": "${{ inputs.compression_format }}",
            "rechunk_seconds": ${{ steps.rechunk.outputs.rechunk_seconds || 0 }},
            "storage_bytes": ${STORAGE_BYTES},
            "observed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat optimized-cost.json

      - name: Upload optimized-build telemetry
        if: inputs.push && ((inputs.rechunk) || (inputs.compression_format != ''))
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: optimized-cost-${{ inputs.image_name }}
          path: optimized-cost.json

  sbom:
    name: SBOM attestation
    needs: build
    if: inputs.push
    uses: ./.github/workflows/sbom-attest.yml
    with:
      registry: ${{ inputs.registry }}
      image_name: ${{ inputs.image_name }}
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ inputs.version }}
      is_release: ${{ inputs.is_release }}
      signing_mode: key
    secrets: inherit
