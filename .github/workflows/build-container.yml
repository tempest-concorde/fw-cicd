name: Build Container (Reusable)

on:
  workflow_call:
    inputs:
      registry:
        description: 'Container registry (e.g., ghcr.io)'
        required: true
        type: string
      image_name:
        description: 'Image name without registry (e.g., tempest-concorde/fw-app)'
        required: true
        type: string
      platform:
        description: 'Platform to build for (e.g., linux/amd64, linux/arm64)'
        required: false
        type: string
        default: 'linux/arm64'
      containerfile:
        description: 'Path to Containerfile (default: Containerfile)'
        required: false
        type: string
        default: 'Containerfile'
      push:
        description: 'Push image to registry (default: true for main/tags)'
        required: false
        type: boolean
        default: true
      compression_format:
        description: 'OCI compression format applied at push (e.g., zstd:chunked). Empty = lane default (plain). Spec 005 build flag.'
        required: false
        type: string
        default: ''
      tags:
        description: 'Space-separated image tags'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (used for the SBOM release asset name)'
        required: false
        type: string
        default: ''
      is_release:
        description: 'Whether this is a release build (drives the SBOM failure policy)'
        required: false
        type: boolean
        default: false
    outputs:
      digest:
        description: 'Image digest'
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ${{ contains(inputs.platform, 'arm64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write  # For cosign keyless signing

    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute tags
        id: tags
        run: |
          if [ -n "${{ inputs.tags }}" ]; then
            echo "tags=${{ inputs.tags }}" >> $GITHUB_OUTPUT
          else
            # Default tags: branch name, sha, latest (if default branch)
            TAGS="test ${{ github.sha }}"
            if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
              TAGS="$TAGS latest"
            fi
            echo "tags=$TAGS" >> $GITHUB_OUTPUT
          fi

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034  # v3.1.0
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          platforms: ${{ inputs.platform }}
          containerfiles: |
            ./${{ inputs.containerfile }}

      - name: Log in to registry
        if: inputs.push
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252  # v2.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ inputs.registry }}

      - name: Timer start (spec 005 optimized push)
        if: inputs.push && inputs.compression_format != ''
        run: echo "OPT_PUSH_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Push to registry (plain)
        if: inputs.push && inputs.compression_format == ''
        id: push_plain
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ inputs.registry }}

      - name: Push to registry (optimized compression, spec 005)
        if: inputs.push && inputs.compression_format != ''
        id: push_opt
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          image: ${{ inputs.image_name }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: ${{ inputs.registry }}
          extra-args: |
            --compression-format=${{ inputs.compression_format }}

      - name: Get digest
        if: inputs.push
        id: digest
        run: |
          set -euo pipefail
          FIRST_TAG=$(echo "${{ steps.tags.outputs.tags }}" | awk '{print $1}')
          # Prefer the push action's own digest output — it is the digest the
          # registry accepted (spec 005 T046: for chunked manifests the pushed
          # digest can differ from any local image record).
          DIGEST="${{ steps.push_plain.outputs.digest }}${{ steps.push_opt.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            DIGEST=$(skopeo inspect "docker://${{ inputs.registry }}/${{ inputs.image_name }}:${FIRST_TAG}" | jq -r '.Digest')
          fi
          : "${DIGEST:?could not resolve the pushed digest}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image digest: $DIGEST"

      - name: Timer stop (spec 005 optimized push)
        if: inputs.push && inputs.compression_format != ''
        run: |
          echo "OPT_PUSH_T1=$(date +%s)" >> "$GITHUB_ENV"
          echo "optimized push wall time: $(( $(date +%s) - ${OPT_PUSH_T0:-$(date +%s)} ))s"

      - name: Record optimized-build telemetry (spec 005, feeds pipeline_cost_min/storage_cost)
        if: inputs.push && inputs.compression_format != ''
        run: |
          set -euo pipefail
          # Registry-side storage for this push = sum of compressed layer blob sizes.
          REPO=${{ inputs.registry }}/${{ inputs.image_name }}
          STORAGE_BYTES=$(skopeo inspect --raw "docker://${REPO}@${{ steps.digest.outputs.digest }}" | jq '[.layers[].size] | add // 0')
          OPT_PUSH_SECONDS=$(( ${OPT_PUSH_T1:-0} - ${OPT_PUSH_T0:-0} ))
          cat > optimized-cost.json <<EOF
          {
            "schema_version": "005.optimized-cost/1",
            "image": "${{ inputs.image_name }}",
            "digest": "${{ steps.digest.outputs.digest }}",
            "rechunk": false,
            "compression_format": "${{ inputs.compression_format }}",
            "rechunk_seconds": 0,
            "optimized_push_seconds": ${OPT_PUSH_SECONDS},
            "storage_bytes": ${STORAGE_BYTES},
            "observed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat optimized-cost.json

      - name: Upload optimized-build telemetry
        if: inputs.push && inputs.compression_format != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: optimized-cost-${{ inputs.image_name }}
          path: optimized-cost.json

      - name: Run Trivy vulnerability scanner
        if: inputs.push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image_name }}@${{ steps.digest.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        if: inputs.push && always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: 'trivy-results.sarif'

  sbom:
    name: SBOM attestation
    needs: build
    if: inputs.push
    uses: ./.github/workflows/sbom-attest.yml
    with:
      registry: ${{ inputs.registry }}
      image_name: ${{ inputs.image_name }}
      image_digest: ${{ needs.build.outputs.digest }}
      version: ${{ inputs.version }}
      is_release: ${{ inputs.is_release }}
      signing_mode: key
    secrets: inherit
